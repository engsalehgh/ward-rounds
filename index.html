<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward Rounds</title>
<style>
:root{--bg:#f5f2ec;--card:#fff;--ink:#1d1b16;--ink2:#6b675d;--line:#e4dfd4;--teal:#2f7d6b;--teal-soft:#e3efeb;--red:#b4453a;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;padding:0 14px 60px;}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:600;margin:26px 0 4px}
.badge{display:inline-block;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-bottom:14px}
.intro{font-size:14px;color:var(--ink2);margin-bottom:14px}
h2{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:600;margin:26px 0 10px}
.callout{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.callout b{display:block;margin-bottom:2px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font-size:13.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.pill.sel{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.pill .cnt{opacity:.75;font-size:12px}
.dayline{font-size:13.5px;color:var(--ink2);margin:12px 0 8px}
.empty{font-size:13.5px;color:var(--ink2);margin:8px 0}
.roomrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.roomrow .rn{font-weight:600;font-size:15px}
.tag{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:1px 8px}
.grow{flex:1}
.sub{font-size:12.5px;color:var(--ink2)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex:0 0 auto;cursor:pointer}
.chk.on{background:var(--teal);border-color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.card .sec{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.lbl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin:8px 0 4px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
.btn{display:inline-block;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:8px;padding:9px 16px;font-size:14.5px;cursor:pointer;margin-top:8px}
.btn.ghost{background:#fff;color:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.mic{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;margin-top:8px;color:var(--ink)}
.mic.live{border-color:var(--red);color:var(--red);font-weight:600}
.status{font-size:12.5px;color:var(--ink2);margin-top:6px}
.hist{font-size:13.5px;margin:4px 0}
.hist .d{color:var(--ink2);font-size:12.5px}
.done{color:var(--teal)}
.del{color:var(--red);font-size:13px;background:none;border:none;cursor:pointer;margin-top:10px;padding:0}
.days{display:flex;flex-wrap:wrap;gap:8px}
.closing{font-size:12.5px;color:var(--ink2);margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;display:none}
.prog>div{height:100%;background:var(--teal);width:0%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
const KEY='ward-rounds.web.v1';
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let state;
let selDay=null;
let openRoom=null;
let pendingDel=null;
let asrPromise=null;

const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=v;}};}})();
function load(){
  try{const s=JSON.parse(store.getItem(KEY));if(s&&s.rooms)return s;}catch(e){}
  const s={visitDays:[0,2],rooms:[]};
  s.rooms=seedRooms(s.visitDays);s.seeded=true;save(s);return s;
}
function save(s){try{store.setItem(KEY,JSON.stringify(s||state));}catch(e){}}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseIso(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,(b||1)-1,c||1);}
function fmtLong(s){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(parseIso(s));}
function fmtShort(s){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric'}).format(parseIso(s));}
function nextVisits(days,count){const set=new Set(days),out=[],d=new Date();d.setHours(0,0,0,0);
  for(let i=0;out.length<count&&i<90;i++){if(set.has(d.getDay()))out.push(iso(d));d.setDate(d.getDate()+1);}return out;}
function prevVisitDay(days){const set=new Set(days),d=new Date();d.setHours(0,0,0,0);
  for(let i=1;i<=14;i++){d.setDate(d.getDate()-1);if(set.has(d.getDay()))return iso(d);}return null;}
let idc=0;function newId(){return 'e-'+Date.now()+'-'+(++idc);}
function seedRooms(days){
  const up=nextVisits(days,3),prev=prevVisitDay(days),h1=[];
  if(prev)h1.push({id:newId(),date:prev,action:'Check wound dressing change and note any redness.',done:true});
  if(up[0])h1.push({id:newId(),date:up[0],action:'Follow up on mobility exercises and walking distance.',done:false});
  const d2=up[1]||up[0]||iso(new Date());
  return [
    {id:newId(),room:'7243',sample:true,history:h1},
    {id:newId(),room:'5118',sample:true,history:[{id:newId(),date:d2,action:'Review sleep medication dose with the night team.',done:false}]},
  ];
}
function todayIso(){return iso(new Date());}
function visitsOn(room,day){return room.history.filter(h=>h.date===day);}
function nextDate(room){const t=todayIso();const f=room.history.filter(h=>!h.done&&h.date>=t).map(h=>h.date).sort();return f[0]||null;}
function scheduledRooms(day){return state.rooms.filter(r=>r.history.some(h=>h.date===day));}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const t=todayIso();
  let days=nextVisits(state.visitDays,7);
  if(!days.includes(t))days=[t,...days.slice(0,6)];
  if(!selDay)selDay=days.includes(t)?t:days[0];
  const pills=days.map(d=>{
    const n=scheduledRooms(d).length;
    const label=d===t?'Today':fmtShort(d);
    return `<button class="pill ${d===selDay?'sel':''}" data-day="${d}">${esc(label)}${n?` <span class="cnt">· ${n}</span>`:''}</button>`;
  }).join('');
  const isToday=selDay===t;
  const rooms=scheduledRooms(selDay);
  function buildCard(r){
    const pend=r.history.filter(x=>!x.done).sort((a,b)=>a.date<b.date?-1:1);
    const hist=[...r.history].sort((a,b)=>a.date<b.date?1:-1);
    return `<div class="card"><div class="sec">
      ${pend.length?pend.map(p=>`<div class="hist"><b>${p.date===t?'Today':fmtLong(p.date)}</b> - ${esc(p.action)}
        <div><button class="btn ghost" data-done="${r.id}|${p.id}">Mark done</button></div></div>`).join('')
      :'<div class="empty">No visit scheduled. Plan the next visit below.</div>'}
      <div class="sec">
        <div class="lbl">Note for the next visit</div>
        <textarea id="plan-${r.id}" placeholder="Plan for the next visit" dir="ltr"></textarea>
        <button class="mic" data-mic="plan-${r.id}">🎙 Record note</button>
        <div class="status" id="st-plan-${r.id}"></div>
        <div class="lbl">Next visit date</div>
        <div class="pills">${nextVisits(state.visitDays,4).map(d=>`<button class="pill" data-pickdate="${r.id}|${d}">${fmtShort(d)}</button>`).join('')}</div>
        <div class="status" id="pd-${r.id}"></div>
        <button class="btn" data-save="${r.id}">Save to schedule</button>
      </div>
      <div class="sec">
        <div class="lbl">Visit history</div>
        ${hist.length?hist.map(x=>`<div class="hist"><span class="d">${fmtShort(x.date)}</span> - ${esc(x.action)} ${x.done?'<span class="done">✓ done</span>':''}</div>`).join(''):'<div class="empty">No visits yet.</div>'}
      </div>
      <button class="del" data-del="${r.id}">${pendingDel===r.id?'Tap again to delete this room and its history':'Delete room'}</button>
    </div></div>`;
  }
  const list=rooms.map(r=>{
    const v=visitsOn(r,selDay)[0];
    const done=v&&v.done;
    const nd=nextDate(r);
    const open=openRoom===r.id;
    return `<div class="roomrow" data-open="${r.id}">
      <button class="chk ${done?'on':''}" data-chk="${r.id}|${selDay}">${done?'✓':''}</button>
      <div class="grow"><span class="rn">Room ${esc(r.room)}</span> ${r.sample?'<span class="tag">Sample</span>':''}
      <div class="sub">${v?esc(v.action):nd?'Next: '+fmtShort(nd):'No visit this day'}</div></div>
      <span class="sub">${open?'▾':'▸'}</span></div>
      ${open?buildCard(r):''}`;
  }).join('');
  const samples=state.rooms.filter(r=>r.sample);
  document.getElementById('app').innerHTML=`
    <h1>Ward Rounds</h1>
    <div class="badge">Prototype</div>
    <div class="intro">A private rounds list with room numbers only: see what each room needs before you walk in, check it off when done, and schedule the next visit from the same card.</div>
    ${samples.length?`<div class="callout"><b>Sample data</b>Rooms tagged "Sample" are made up so you can try the page.<br><button class="btn ghost" data-clearsamples>Remove samples</button></div>`:''}
    <h2>Rounds</h2>
    <div class="pills">${pills}</div>
    <div class="dayline">${isToday?'Today — ':''}${fmtLong(selDay)}</div>
    ${rooms.length?list:`<div class="empty">No rooms scheduled for ${isToday?'today':'this day'}. Add a room below, or open a room under All rooms to plan a visit.</div>`}
    <h2>Add a room</h2>
    <div class="card">
      <div class="lbl">Room number</div>
      <input type="text" id="newroom" inputmode="numeric" placeholder="7243" dir="ltr">
      <div class="lbl">What needs to be done on the next visit</div>
      <textarea id="newaction" placeholder="e.g. Check blood pressure and refill meds" dir="ltr"></textarea>
      <button class="mic" data-mic="newaction">🎙 Record note</button>
      <div class="status" id="st-newaction"></div>
      <div class="lbl">First visit date</div>
      <div class="pills">${nextVisits(state.visitDays,4).map(d=>`<button class="pill" data-newdate="${d}">${fmtShort(d)}</button>`).join('')}</div>
      <div class="status" id="newdate-pick"></div>
      <button class="btn" data-addroom>Add room</button>
      <div class="status" id="addmsg"></div>
    </div>
    <h2>All rooms</h2>
    ${state.rooms.length?state.rooms.map(r=>{const nd=nextDate(r);const open=openRoom===r.id;return `<div class="roomrow" data-open="${r.id}"><div class="grow"><span class="rn">Room ${esc(r.room)}</span> ${r.sample?'<span class="tag">Sample</span>':''}<div class="sub">${nd?'Next: '+fmtShort(nd):'No visit scheduled'}</div></div><span class="sub">${open?'▾':'▸'}</span></div>${open?buildCard(r):''}`;}).join(''):'<div class="empty">No rooms yet.</div>'}
    <h2>Weekly rounds days</h2>
    <div class="days">${DAY_NAMES.map((n,i)=>`<button class="pill ${state.visitDays.includes(i)?'sel':''}" data-vday="${i}">${n}</button>`).join('')}</div>
    <div class="closing">Voice notes are transcribed on this device - recordings never leave your phone. Saved notes stay in this page's storage on this device. Room numbers only - no patient names or medical file numbers. Prototype for evaluation.</div>`;
}

let newDatePick=null;
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-day],[data-open],[data-chk],[data-clearsamples],[data-vday],[data-addroom],[data-newdate],[data-save],[data-pickdate],[data-done],[data-del],[data-mic]');
  if(!el)return;
  const d=el.dataset;
  if(d.day){selDay=d.day;openRoom=null;render();return;}
  if(d.chk){const[rid,day]=d.chk.split('|');const r=state.rooms.find(x=>x.id===rid);const v=r&&visitsOn(r,day)[0];
    if(v){v.done=!v.done;}else if(r){r.history.push({id:newId(),date:day,action:'Visit',done:true});}
    save();render();return;}
  if(d.open&&e.target.closest('[data-chk],[data-mic],[data-save],[data-del],[data-done],[data-pickdate],textarea'))return;
  if(d.open){openRoom=openRoom===d.open?null:d.open;pendingDel=null;render();return;}
  if(d.clearsamples!==undefined){state.rooms=state.rooms.filter(r=>!r.sample);save();render();return;}
  if(d.vday!==undefined){const i=+d.vday;const k=state.visitDays.indexOf(i);
    if(k>=0&&state.visitDays.length>1)state.visitDays.splice(k,1);else if(k<0)state.visitDays.push(i);
    save();selDay=null;render();return;}
  if(d.newdate){newDatePick=d.newdate;document.getElementById('newdate-pick').textContent='First visit: '+fmtLong(d.newdate);return;}
  if(d.pickdate){const[rid,day]=d.pickdate.split('|');const el2=document.getElementById('pd-'+rid);if(el2)el2.textContent='Next visit: '+fmtLong(day);el.setAttribute('data-sel','1');document.querySelectorAll(`[data-pickdate^="${rid}|"]`).forEach(b=>b.classList.remove('sel'));el.classList.add('sel');return;}
  if(d.save){const r=state.rooms.find(x=>x.id===d.save);const ta=document.getElementById('plan-'+d.save);
    const day=(document.querySelector(`[data-pickdate^="${d.save}|"].sel`)||{}).dataset?document.querySelector(`[data-pickdate^="${d.save}|"].sel`).dataset.pickdate.split('|')[1]:null;
    const txt=ta&&ta.value.trim();
    if(!txt||!day){const m=document.getElementById('pd-'+d.save);if(m)m.textContent=(!txt?'Write the note first. ':'')+(!day?'Pick the next visit date.':'');return;}
    r.history.push({id:newId(),date:day,action:txt,done:false});save();render();return;}
  if(d.done){const[rid,vid]=d.done.split('|');const r=state.rooms.find(x=>x.id===rid);const v=r&&r.history.find(h=>h.id===vid);if(v){v.done=true;save();render();}return;}
  if(d.del){if(pendingDel===d.del){state.rooms=state.rooms.filter(r=>r.id!==d.del);pendingDel=null;openRoom=null;save();render();}else{pendingDel=d.del;render();}return;}
  if(d.addroom!==undefined){const rn=(document.getElementById('newroom').value||'').trim();
    const ac=(document.getElementById('newaction').value||'').trim();
    const msg=document.getElementById('addmsg');
    if(!rn){msg.textContent='Enter the room number.';return;}
    if(!ac){msg.textContent='Write what needs to be done.';return;}
    if(!newDatePick){msg.textContent='Pick the first visit date.';return;}
    if(state.rooms.some(r=>r.room===rn)){msg.textContent='Room '+rn+' already exists. Open it below to plan its next visit.';return;}
    state.rooms.push({id:newId(),room:rn,history:[{id:newId(),date:newDatePick,action:ac,done:false}]});
    newDatePick=null;save();selDay=null;openRoom=null;render();return;}
  if(d.mic){toggleRecord(d.mic);}
});

// ---------- on-device speech-to-text ----------
const T_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6';
let rec=null,chunks=[],recTarget=null,recBtn=null;

function setStatus(id,msg,pct){const el=document.getElementById('st-'+id);if(!el)return;
  el.innerHTML=esc(msg)+(pct!=null?`<div class="prog" style="display:block"><div style="width:${Math.round(pct)}%"></div></div>`:'');}

async function getAsr(statusId){
  if(!asrPromise){asrPromise=(async()=>{
    const T=await import(T_URL);
    T.env.allowLocalModels=false;
    return T.pipeline('automatic-speech-recognition','onnx-community/whisper-base.en',{dtype:'q8',device:'wasm',
      progress_callback:p=>{if(p.status==='progress'&&p.total)setStatus(statusId,'First use downloads the speech model (~77 MB). It is kept in the browser cache, so later visits usually load faster.',p.loaded/p.total*100);}});
  })();}
  return asrPromise;
}

async function toggleRecord(targetId){
  const ta=document.getElementById(targetId);
  const btn=document.querySelector(`[data-mic="${targetId}"]`);
  if(rec&&recTarget===targetId){rec.stop();return;}
  if(rec){rec.stop();}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus(targetId,'This browser cannot record audio. Type the note instead.');return;}
  setStatus(targetId,'Waiting for microphone permission…');
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(err){setStatus(targetId,'Microphone permission was not granted. Tap the record button again and choose Allow, or type the note.');return;}
  recTarget=targetId;recBtn=btn;chunks=[];
  const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm',''].find(m=>!m||(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)));
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);}catch(e){rec=new MediaRecorder(stream);}
  rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    if(btn){btn.classList.remove('live');btn.textContent='🎙 Record note';}
    const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
    rec=null;const tid=recTarget;recTarget=null;
    if(blob.size<500){setStatus(tid,'Nothing was recorded. Try again and speak a little longer.');return;}
    setStatus(tid,'Loading the speech model…');
    try{
      const asr=await getAsr(tid);
      setStatus(tid,'Transcribing on this device…');
      const buf=await blob.arrayBuffer();
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=new AC();
      const dec=await ac.decodeAudioData(buf);
      const off=new OfflineAudioContext(1,Math.ceil(dec.duration*16000),16000);
      const src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();
      const rendered=await off.startRendering();
      await ac.close();
      const audio=rendered.getChannelData(0);
      const out=await asr(audio);
      const text=(out.text||'').trim();
      if(!text){setStatus(tid,'No speech was recognized. Try again, or type the note.');return;}
      const cur=document.getElementById(tid);
      if(cur){cur.value=(cur.value.trim()?cur.value.trim()+' ':'')+text;cur.focus();}
      setStatus(tid,'Transcribed on this device. Review the note, edit if needed, then save.');
    }catch(err){
      setStatus(tid,'Transcription did not work here ('+(err&&err.message?String(err.message).slice(0,80):'error')+'). Type the note instead.');
    }
  };
  rec.start(250);
  if(btn){btn.classList.add('live');btn.textContent='■ Stop';}
  setStatus(targetId,'Recording… tap Stop when finished.');
}

state=load();
render();
</script>
</body>
</html>
